<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171719" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <title>连接授权 · ARC</title>
  <link rel="icon" href="/oauth/favicon.ico" sizes="any">
  <link rel="icon" href="/oauth/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/oauth/logo.png">
  <link rel="stylesheet" href="/oauth/tokens.css">
  <script src="/oauth/page.js" defer></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;font-family:var(--font-ui);color:var(--text);background:var(--surface-subtle)}
    main{width:100%;max-width:440px;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel)}
    .brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}.brand img{width:36px;height:36px}h1{font-size:24px;margin:28px 0 12px;letter-spacing:-.5px}p{font-size:14px;line-height:1.6;margin:0;color:var(--text-secondary)}
    dl{margin:24px 0;padding:16px;border:1px solid var(--border);border-radius:var(--radius-row);font-size:13px}dt{color:var(--text-secondary);margin-top:12px}dt:first-child{margin-top:0}dd{margin:4px 0 0;overflow-wrap:anywhere}
    .return{display:inline-block;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--border);border-radius:var(--radius-control);padding:10px 16px;background:var(--text);color:var(--surface);margin-top:16px;text-decoration:none}.return:focus-visible{outline:2px solid var(--text-secondary);outline-offset:3px}
    #hint,footer{font-size:12px;color:var(--text-secondary);margin-top:16px}footer{margin-top:28px} [hidden]{display:none!important}
    @media(prefers-color-scheme:dark){:root{--surface:#171719;--surface-subtle:#101012;--text:#f2f2f3;--text-secondary:#aaaab3;--border:#35353b;--danger:#ff9b93}}
    @media(max-width:420px){body{padding:16px}main{padding:24px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/oauth/logo.png" alt="ARC" width="36" height="36">ARC</div>
    <h1 id="title">连接授权</h1>
    <p id="status" role="status" aria-live="polite">正在读取授权请求…</p>
    <dl id="details" hidden><dt>客户端</dt><dd id="client"></dd><dt>连接</dt><dd id="connection"></dd><dt>返回地址</dt><dd id="callback"></dd></dl>
    <div id="consent" hidden>
      <a id="open-app" class="return">打开 ARC</a>
      <p id="hint">请在 ARC 的弹窗中同意或拒绝。若目标连接在另一台设备，请到那台设备打开 ARC 确认，或由已授权的 Agent 使用目标设备的 CLI 确认。</p>
    </div>
    <a id="return" class="return" hidden>返回客户端</a>
    <noscript><p>请启用 JavaScript 以读取授权状态。</p></noscript>
    <footer>确认后此页面将自动返回客户端，请保持页面打开。</footer>
  </main>
</body>
</html>
