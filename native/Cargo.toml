[package]
name = "connector-core"
version = "0.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "local-connector"
path = "src/main.rs"

[features]
# Compiled only by the contract fixture, never desktop builds.
test-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
minisign-verify = "0.2"
semver = "1"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls-no-provider"] }
jsonschema = { version = "0.33", default-features = false }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"
flate2 = "1"
zstd = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
