[package]
name = "arc-core"
version = "0.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "arc"
path = "src/main.rs"

[features]
# Compiled only by the contract fixture, never desktop builds.
test-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = ">=0.4, <1"
url = "2"
sha2 = ">=0.11, <1"
base64 = ">=0.22, <1"
image = { version = ">=0.25, <1", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
dirs = "6"
reqwest = { version = ">=0.13, <1", default-features = false, features = ["json", "form", "query", "rustls-no-provider", "stream", "socks"] }
jsonschema = { version = ">=0.60, <1", default-features = false }
regex = "1"
libc = ">=0.2, <1"
flate2 = "1"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
rusqlite = { version = ">=0.37, <1", features = ["bundled"] }
rustls = { version = ">=0.23, <1", default-features = false, features = ["ring"] }
ring = ">=0.17, <1"
futures-util = { version = ">=0.3, <1", features = ["sink"] }
tokio-tungstenite = { version = ">=0.28, <1", default-features = false, features = ["handshake"] }

hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = ">=0.1, <1", features = ["tokio"] }
http-body-util = ">=0.1, <1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.61, <1", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = ">=0.1, <1"
objc2-foundation = { version = ">=0.3.2, <1", features = ["NSProcessInfo"] }
notify-rust = "4.18"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
