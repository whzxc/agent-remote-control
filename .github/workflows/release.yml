name: Build release platforms
run-name: Release ${{ inputs.tag }} (${{ inputs.platforms }})
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        type: string
        required: true
      platforms:
        description: Comma-separated CI platforms (windows,linux)
        type: string
        required: true
        default: windows,linux
env:
  ARC_BUILD_VERSION: ${{ inputs.tag }}
permissions:
  contents: read
concurrency:
  group: connector-release
  cancel-in-progress: false
jobs:
  linux:
    if: contains(format(',{0},', inputs.platforms), ',linux,')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: . -> target
          shared-key: linux-${{ matrix.arch }}
      - name: Check and build headless Core
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo clippy --manifest-path native/Cargo.toml --locked --target "$TARGET"
          cargo build --manifest-path native/Cargo.toml --locked --release --bin arc --target "$TARGET"
      - name: Package Linux tarball
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "v$(target/$TARGET/release/arc --version)" = "$RELEASE_TAG"
          mkdir -p linux-package linux-artifacts
          cp "target/$TARGET/release/arc" LICENSE linux-package/
          mkdir -p linux-package/skills
          cp -R skills/arc-setup linux-package/skills/
          cp -R licenses linux-package/
          tar -czf "linux-artifacts/agent-remote-control-$RELEASE_TAG-linux-$ARCH.tar.gz" -C linux-package arc LICENSE skills licenses
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: linux-artifacts/*.tar.gz
          if-no-files-found: error
  windows:
    if: contains(format(',{0},', inputs.platforms), ',windows,')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: desktop-x86_64-pc-windows-msvc
          key: shared-target-v2
          workspaces: |
            . -> target
          cache-bin: false
          save-if: 'true'
      - run: npm ci
      - name: Build signed desktop installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --release --target x86_64-pc-windows-msvc
      - name: Stage platform artifacts
        run: npm run release:stage -- windows-x86_64 target/x86_64-pc-windows-msvc/release/bundle release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: release-artifacts/*
          if-no-files-found: error
