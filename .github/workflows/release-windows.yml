name: Release Windows
run-name: Windows supplement ${{ inputs.tag || 'latest' }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty uses the latest public release)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: connector-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag=$(gh release view ${RELEASE_TAG:+"$RELEASE_TAG"} --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "CLC_BUILD_VERSION=$tag" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: desktop-x86_64-pc-windows-msvc
          key: shared-target-v2
          workspaces: |
            desktop -> ../target
          cache-bin: false
          save-if: 'true'
      - run: npm ci
      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --release --target x86_64-pc-windows-msvc
      - name: Merge metadata and verify signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm run release:stage -- windows-x86_64 target/x86_64-pc-windows-msvc/release/bundle release-artifacts
          gh release download "$RELEASE_TAG" --pattern latest.json --pattern SHA256SUMS.txt --dir release-artifacts
          node tooling/release.mjs merge-windows release-artifacts
      - name: Upload Windows supplement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-artifacts/*.exe release-artifacts/*.sig
          release-artifacts/latest.json release-artifacts/SHA256SUMS.txt --clobber
