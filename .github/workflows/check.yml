name: Check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Dependencies
        run: npm ci
      - name: TypeScript and Go formatting
        run: |
          npm run check
          npm run check:go-format
      - name: Daily tests
        env:
          ARC_CI_DAILY_TEST_BUDGET_SECONDS: '90'
        run: npm test
      - name: Go vet and tests, default and arcfixture
        if: ${{ !cancelled() }}
        run: npm run test:go
      - name: Windows named-pipe contracts
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: go test -count=1 -v ./internal/platform
      - name: Browser ingress
        if: ${{ !cancelled() }}
        run: node tooling/test.mjs --native tests/browser-native.test.ts
      - name: MyGo desktop bundle
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: npm run desktop:build -- --development --no-image
  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [darwin/arm64, windows/amd64, linux/amd64, linux/arm64]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run build -- --release --target=${{ matrix.target }}
