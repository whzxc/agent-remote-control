<rect data-canvas="" width="474" height="136" style="fill:var(--canvas)"/>
<text x="40" y="46" class="note">pills</text>
<g data-component="single-choice" data-form="pills" transform="translate(40 62)">
  <rect width="258" height="34" rx="17" style="fill:var(--surface-sunken)"/>
  <rect x="3" y="3" width="84" height="28" rx="14" style="fill:var(--surface-raised);filter:var(--elev-sm)"/>
  <text x="45" y="17" style="fill:var(--text);font-size:var(--text-small);font-weight:650;text-anchor:middle">跟随系统</text>
  <text x="129" y="17" style="fill:var(--text-secondary);font-size:var(--text-small);text-anchor:middle">亮色</text>
  <text x="213" y="17" style="fill:var(--text-secondary);font-size:var(--text-small);text-anchor:middle">暗色</text>
</g>
<text x="330" y="46" class="note">dropdown</text>
<g data-component="single-choice" data-form="dropdown" transform="translate(330 62)">
  <rect width="104" height="34" rx="17" style="fill:var(--surface-sunken)"/>
  <text x="16" y="17" style="fill:var(--text);font-size:var(--text-small)">跟随系统</text>
  <g data-icon="chevron-down" transform="translate(76 9) scale(0.6667)" style="fill:none;stroke:var(--text-secondary);stroke-width:2.63;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6"/></g>
