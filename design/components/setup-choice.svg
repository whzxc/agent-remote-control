<!-- /design:tokens -->
<rect data-canvas="" width="760" height="330" style="fill:var(--canvas)"/>
<defs><filter id="privacy-mask"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
<text x="40" y="42" class="note">row</text><g transform="translate(40 62)" data-component="setup-choice" data-form="row">
<rect x="0" y="0" width="680" height="72" rx="18" style="fill:var(--surface-subtle)" data-fluid="height"/><circle cx="24" cy="36.0" r="9" style="fill:var(--surface-sunken)"/><circle cx="24" cy="36.0" r="4" style="fill:var(--accent-text)"/><text x="46" y="24"  style="fill:var(--text);font-size:var(--text-body);font-weight:650;" >创建我的中继</text><text x="46" y="48"  style="fill:var(--text-secondary);font-size:var(--text-small);" >推荐 · 部署到你的 Cloudflare 免费账号</text>
</g><text x="40" y="184" class="note">product</text><g transform="translate(40 204)" data-component="setup-choice" data-form="product">
<rect x="0" y="0" width="204" height="76" rx="18" style="fill:var(--surface-subtle)" data-fluid="height"/><g data-brand="claude-code" style="color:var(--text)"><svg x="14" y="16" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path clip-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z" fill="#D97757" fill-rule="evenodd"></path></svg></g><text x="48" y="28"  style="fill:var(--text);font-size:var(--text-small);font-weight:600;" >Claude Code</text><text x="14" y="58"  style="fill:var(--text-secondary);font-size:var(--text-meta);" >仅本机客户端可用</text>
