  <title>Reasoning Effort</title>
  <desc>One evenly spaced point represents each supported reasoning level. Levels increase clockwise from the lower-left stop to the lower-right stop. A tapered needle with a rounded base aligns with the larger selected point. The tinted arc leads from the first point to the selected point.</desc>
  <rect width="472" height="180" data-canvas="" style="fill:var(--canvas)" />
  <text x="24" y="26" style="fill:var(--text);font-size:var(--text-title);font-weight:650">Reasoning Effort</text>
  <g data-component="effort-gauge" data-form="three-levels" transform="translate(80 54) scale(2.5)">
    <rect width="32" height="32" style="fill:none" />
    <path d="M5.3749 21.3998 A11.5 11.5 0 0 1 11.8706 6.267 M20.1294 6.267 A11.5 11.5 0 0 1 26.6251 21.3998" data-part="track" style="fill:none;stroke:var(--border-strong);stroke-width:2.4;stroke-linecap:round" />
    <path d="M5.3749 21.3998 A11.5 11.5 0 0 1 11.8706 6.267" data-part="range" style="fill:none;stroke:var(--role-agent);stroke-width:2.4;stroke-linecap:round" />
    <g data-part="levels">
      <circle cx="7.1905" cy="24.3921" r="1.65" data-level="1" style="fill:var(--role-agent)" />
      <circle cx="16" cy="5.5" r="2.35" data-level="2" data-selected="" style="fill:var(--role-agent)" />
      <circle cx="24.8095" cy="24.3921" r="1.65" data-level="3" style="fill:var(--text-tertiary)" />
    </g>
    <path d="M13.4433 16.1321 L16 8.6 L18.5567 16.1321 A2.7 2.7 0 1 1 13.4433 16.1321 Z" data-part="needle" style="fill:var(--text)" />
  </g>
  <text class="note" x="120" y="151" style="text-anchor:middle">3 levels · Medium</text>
  <g data-component="effort-gauge" data-form="five-levels" transform="translate(312 54) scale(2.5)">
    <rect width="32" height="32" style="fill:none" />
    <path d="M5.3749 21.3998 A11.5 11.5 0 0 1 4.5982 15.5001 M7.5221 9.2298 A11.5 11.5 0 0 1 12.5408 6.0326 M19.4592 6.0326 A11.5 11.5 0 0 1 23.9823 8.7215 M27.4726 16.2065 A11.5 11.5 0 0 1 26.6251 21.3998" data-part="track" style="fill:none;stroke:var(--border-strong);stroke-width:2.4;stroke-linecap:round" />
    <path d="M5.3749 21.3998 A11.5 11.5 0 0 1 4.5982 15.5001 M7.5221 9.2298 A11.5 11.5 0 0 1 12.5408 6.0326 M19.4592 6.0326 A11.5 11.5 0 0 1 23.9823 8.7215" data-part="range" style="fill:none;stroke:var(--role-agent);stroke-width:2.4;stroke-linecap:round" />
    <g data-part="levels">
      <circle cx="7.1905" cy="24.3921" r="1.65" data-level="1" style="fill:var(--role-agent)" />
      <circle cx="5.5775" cy="12.1399" r="1.65" data-level="2" style="fill:var(--role-agent)" />
      <circle cx="16" cy="5.5" r="1.65" data-level="3" style="fill:var(--role-agent)" />
      <circle cx="26.4225" cy="12.1399" r="2.35" data-level="4" data-selected="" style="fill:var(--role-agent)" />
      <circle cx="24.8095" cy="24.3921" r="1.65" data-level="5" style="fill:var(--text-tertiary)" />
