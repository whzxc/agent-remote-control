  <title>Dispatch Spec</title>
  <desc>The model, selected reasoning effort and Fast service tier share one pill. The gauge points to Medium, the second of three levels.</desc>
  <rect width="178" height="104" data-canvas="" style="fill:var(--canvas)" />
  <text x="24" y="26" style="fill:var(--text);font-size:var(--text-title);font-weight:650">Dispatch Spec</text>
