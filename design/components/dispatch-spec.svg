      <g data-part="levels">
        <circle cx="7.1905" cy="24.3921" r="1.65" data-level="1" style="fill:var(--role-agent)" />
        <circle cx="16" cy="5.5" r="2.35" data-level="2" data-selected="" style="fill:var(--role-agent)" />
        <circle cx="24.8095" cy="24.3921" r="1.65" data-level="3" style="fill:var(--text-tertiary)" />
      </g>
      <path d="M13.4433 16.1321 L16 8.6 L18.5567 16.1321 A2.7 2.7 0 1 1 13.4433 16.1321 Z" data-part="needle" style="fill:var(--text)" />
    </g>
