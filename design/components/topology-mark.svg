      <circle cx="18" cy="50" r="10" style="fill:var(--role-source)" />
      <circle cx="82" cy="50" r="10" style="fill:var(--role-agent)" />
    </g>
    <g data-icon="power" transform="translate(111 194) scale(0.75)" style="fill:none;stroke:var(--canvas);stroke-width:2.3333333333333335;stroke-linecap:round;stroke-linejoin:round">
