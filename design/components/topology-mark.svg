  <title>Topology Mark</title>
  <desc>ARC mark. Source and Agent dots, connection upper arc and access lower arc retain their existing roles. Earcups and branch endpoints belong to solver geometry.</desc>
  <rect width="320" height="320" rx="0" style="fill:var(--canvas)" data-canvas="" />
  <g data-component="topology-mark" data-form="default" transform="translate(40 40)">
    <rect width="240" height="240" rx="0" style="fill:none" />
    <g transform="translate(-10.4348 -10.4348) scale(2.608696)">
