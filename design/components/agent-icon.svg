  <title>Agent Icon</title>
  <desc>Four forms share a centered Agent mark. The single ring shows the selected quota. The two-part ring shows session on the left and week on the right. Consumption advances downward from the top in both halves. The remaining quota is anchored at the bottom. The three-part ring starts at twelve o’clock and assigns one equal sector each to session, week and month, clockwise. Each fill encodes quota within its sector. A rounded tick crosses each quota arc and independently marks elapsed time within its window.</desc>
