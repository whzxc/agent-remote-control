[package]
name = "agent-remote-control"
version = "0.0.0"
edition = "2021"
license = "MIT"
default-run = "agent-remote-control-desktop"

# Executable identity used by OS login registrations.
[[bin]]
name = "agent-remote-control-desktop"
path = "src/main.rs"

# Build the Core executable with the desktop dependency graph so both binaries
# reuse the same arc-core library and transitive dependency features.
[[bin]]
name = "arc"
path = "../native/src/main.rs"
required-features = ["core-bin"]

[features]
core-bin = []

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "unstable"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Reuse the plugin's notification backend for desktop activation callbacks.
notify-rust = "4.18"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "~2.11.0"
serde_json = "1"
arc-core = { path = "../native" }
tokio = { version = "1", features = ["full"] }
dirs = "6"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication"] }

objc2 = "0.6.3"

block2 = "0.6.2"

wry = "=0.57.0"
uuid = { version = "1", features = ["v4"] }
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc", "zeroize"] }
pbkdf2 = "0.12.2"
sha1 = "0.10.6"
sha2 = "0.10"
zeroize = "1.9"
rusqlite = { version = "0.37", features = ["bundled"] }
security-framework = "3.7"
tempfile = "3"
objc2-foundation = { version = "0.3.2", features = ["NSHTTPCookie", "NSDictionary", "NSString", "NSDate", "NSProcessInfo", "NSUUID"] }

objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebsiteDataStore", "block2"] }
