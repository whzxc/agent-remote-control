[workspace]
members = ["native", "desktop", "tests/fixture", "tooling/verifier"]
default-members = ["native", "desktop"]
resolver = "2"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
lto = false
codegen-units = 16
strip = true

